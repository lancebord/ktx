// x76: endless FFA, lightning gun only, vampiric damage.
// Executed on every map load when "k_use_matchless_dir 3" is set (see x76.cfg).

set k_mode                      3    // server mode (3 = ffa)
deathmatch                      4    // x76 is built on dmm4: infinite ammo, no item respawns
teamplay                        0    // everyone for themselves
set k_x76                       1    // spawn with 200 health and LG only, heal back all damage dealt (capped at 200)

// endless match: players come and go, the game never ends
timelimit                       0    // no timelimit (only allowed together with k_x76 in matchless mode)
fraglimit                       0    // no fraglimit
samelevel                       1    // stay on the map, change only when players vote
set k_matchless_countdown       0    // start immediately when the first player joins
set k_matchless_max_idle_time   180  // move idle players to spectator after 3 minutes (0 = never)

// no pickups of any kind
set k_pow                       0    // no powerups
set dp                          0    // no backpacks (x76 never drops them anyway)
set dq                          0
set dr                          0

set dmm4_invinc_time            1    // seconds of spawn protection (-1 = off, 0 = default of 2)

// voting
set k_no_vote_map               0    // allow map voting and /next_map
set k_no_vote_break             1    // no /break, the match is meant to run forever

maxclients                      16
set k_maxclients                16
set k_spectalk                  1    // spectators can talk to players

// map rotation, used by /next_map
set k_defmap "dm6"
set k_ml_0  "dm6"
set k_ml_1  "dm2"
set k_ml_2  "dm3"
set k_ml_3  "e1m2"
set k_random_maplist            0
