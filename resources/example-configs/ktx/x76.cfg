//
// Enables an endless x76 server: FFA, lightning gun only, vampiric damage,
// 200 starting and maximum health, no timelimit. Exec this from the server's
// startup config. Game rules live in configs/usermodes/matchless/x76.cfg.
//

set k_matchless                 1    // run as a matchless server: players join and leave a running game
set k_mode                      3    // server mode (3 = ffa)
set k_use_matchless_dir         3    // load configs/usermodes/matchless/x76.cfg on every map
